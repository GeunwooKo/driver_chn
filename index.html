<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>중국 운전면허 시험 대비 퀴즈</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230B4EA2' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <section id="screen-start" class="screen">
    <div class="gantry">
      <div class="gantry-badge">科目一 · 理论考试</div>
      <h1>중국 운전면허<br>필기시험</h1>
      <div class="gantry-divider"></div>
      <p class="subtitle">乐驾中国 CHINA-DRIVE 자료 기반 · 무작위 50문제</p>
    </div>
    <div id="start-stats" class="stats"></div>
    <button id="btn-start" class="btn btn-primary">퀴즈 시작 <span class="chevron" aria-hidden="true">›</span></button>
  </section>

  <section id="screen-quiz" class="screen hidden">
    <div class="quiz-header">
      <div class="progress-text"><span id="q-index">1</span> / <span id="q-total">50</span></div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <div class="score-text">정답 <span id="score-count">0</span></div>
    </div>

    <div id="question-card" class="card">
      <div id="q-image-wrap" class="q-image-wrap hidden">
        <img id="q-image" alt="문제 이미지">
      </div>
      <div id="q-number" class="q-number"></div>
      <div id="q-text" class="q-text"></div>
      <div id="q-options" class="q-options"></div>
      <div id="q-feedback" class="q-feedback hidden"></div>
    </div>

    <div class="quiz-actions">
      <button id="btn-next" class="btn btn-primary hidden">다음 문제 <span class="chevron" aria-hidden="true">›</span></button>
    </div>
  </section>

  <section id="screen-result" class="screen hidden">
    <h1>결과</h1>
    <div class="result-score-wrap">
      <div class="result-score-label">Score</div>
      <div id="result-score" class="result-score"></div>
    </div>
    <div id="result-summary" class="result-summary"></div>
    <div id="review-list" class="review-list"></div>
    <div class="quiz-actions">
      <button id="btn-retry" class="btn btn-primary">다시 풀기</button>
    </div>
  </section>

</div>
<script src="questions.js"></script>
<script src="app.js"></script>
</body>
</html>
